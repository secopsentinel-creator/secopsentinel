<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}secopsentinel{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  <script src="{{ url_for('static', path='js/htmx.min.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>secopsentinel</strong>
      <span>Investigación judicial y contratación estatal</span>
    </div>
    {% block nav %}
    {% if user is defined and user %}
    <nav class="nav">
      <a href="/">Panel</a>
      <a href="/cases">Casos</a>
      <a href="/cases/new">Nuevo caso</a>
      <form method="post" action="/logout" class="logout-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="ghost">Salir</button>
      </form>
    </nav>
    {% endif %}
    {% endblock %}
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    Ejecución local. Datos judiciales fuera del docroot.
  </footer>
</body>
</html>
